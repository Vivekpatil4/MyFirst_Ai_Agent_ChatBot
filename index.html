<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask-Me</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-br from-black via-neutral-950 to-green-950 text-white overflow-x-hidden min-h-screen">

    <!-- Background Glow -->
    <div class="absolute top-0 left-0 w-72 h-72 bg-green-500/20 blur-3xl rounded-full"></div>
    <div class="absolute bottom-0 right-0 w-72 h-72 bg-green-400/10 blur-3xl rounded-full"></div>

    <div class="container mx-auto max-w-3xl pb-44 px-3 relative z-10" id="chat-container">

        <!-- Messages goes here -->

        <!-- Example User Message -->
        <!--
        <div class="flex justify-end my-4">
            <div class="bg-green-600 px-4 py-3 rounded-2xl shadow-lg max-w-fit">
                Hello
            </div>
        </div>
        -->

        <!-- Example Assistant Message -->
        <!--
        <div class="flex justify-start my-4">
            <div class="bg-neutral-800 border border-green-700 px-4 py-3 rounded-2xl shadow-lg max-w-fit">
                Hi, how can I help you?
            </div>
        </div>
        -->

        <!-- Bottom textarea -->
        <div class="fixed inset-x-0 bottom-0 flex items-center justify-center backdrop-blur-md bg-black/40 border-t border-green-900">

            <div class="bg-neutral-900/90 border border-green-700 shadow-2xl shadow-green-900/30 p-3 rounded-3xl w-full max-w-3xl mb-4 mx-3">

                <textarea
                    class="w-full resize-none outline-none p-4 rounded-2xl bg-black text-white placeholder:text-gray-400 border border-green-800 focus:border-green-500 focus:ring-2 focus:ring-green-600 transition-all duration-300"
                    rows="2"
                    id="input"
                    placeholder="Ask anything..."></textarea>

                <div class="flex items-center justify-end mt-3">

                    <button id="ask"
                        class="bg-gradient-to-r from-green-500 to-green-700 px-6 py-2 text-white font-semibold rounded-full cursor-pointer hover:scale-105 hover:shadow-lg hover:shadow-green-500/40 transition-all duration-300">
                        Ask
                    </button>

                </div>
            </div>
        </div>

    </div>

    <script src="./script.js"></script>
</body>

</html>
